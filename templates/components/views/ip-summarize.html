<!-- IP Summarizer -->
<div id="view-ipsummarize" class="content-section">
    <div class="tool-card" style="max-width: 900px;">
        <h4 class="fw-bold mb-3">IP Summarizer</h4>
        <p class="text-muted small mb-4">IP/CIDR/Range 목록을 최대한 적은 CIDR 블록으로 축약합니다.</p>

        <div class="row g-4 mb-4">
            <!-- Input -->
            <div class="col-lg-6">
                <div class="p-3 rounded bg-light border h-100">
                    <label class="small fw-bold mb-2 d-flex justify-content-between">
                        IP List
                        <span class="badge bg-secondary" id="summarizeCount">0 lines</span>
                    </label>
                    <textarea class="form-control font-monospace" id="summarizeInput" rows="15" placeholder="10.0.0.0/25&#10;10.0.0.128/25&#10;192.168.1.50&#10;172.16.0.1-172.16.0.100"></textarea>
                    <div class="form-check mt-3">
                        <input class="form-check-input" type="checkbox" id="summarizeClassC">
                        <label class="form-check-label small" for="summarizeClassC">
                            C클래스(/24) 단위로 축약 (같은 /24에 속한 IP를 /24 전체로 묶음, 과포함 발생 가능)
                        </label>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="col-lg-6">
                <div class="p-3 rounded bg-light border h-100 d-flex flex-column">
                    <label class="small fw-bold mb-2 d-flex justify-content-between">
                        Summarized Results
                        <span class="badge bg-primary" id="summarizeResultCount">0 blocks</span>
                    </label>
                    <div id="summarizeResults" class="flex-grow-1 overflow-auto" style="max-height: 400px;">
                        <div class="text-center text-muted py-5 mt-5">
                            <small>축약 버튼을 눌러주세요</small>
                        </div>
                    </div>
                    <div id="summarizeErrors" class="alert alert-warning small p-2 mt-3 d-none">
                        <div class="fw-bold mb-1">파싱 실패한 줄</div>
                        <pre id="summarizeErrorList" class="mb-0" style="white-space: pre-wrap;"></pre>
                    </div>
                    <button class="btn btn-outline-secondary btn-sm mt-3" onclick="copyToClipboard('summarizeResultsText')" id="btnCopySummarize" disabled>결과 텍스트 복사</button>
                    <!-- Hidden textarea for copying results -->
                    <textarea id="summarizeResultsText" class="d-none"></textarea>
                </div>
            </div>
        </div>

        <div class="text-center">
            <button class="btn btn-primary px-5 py-2 fw-bold" onclick="summarizeIps()">
                축약
            </button>
        </div>
    </div>
</div>
